  /stream/{ticket}/{fileName}:
    get:
      operationId: readPlaybackBytes
      tags:
      - Playback
      summary: Validate scoped ticket and serve verified media bytes
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                format: int64
                minimum: 0
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '206':
          description: Valid single byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                format: int64
                minimum: 0
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Content-Range:
              schema:
                type: string
        '416':
          description: Unsatisfiable against logical final length
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                format: int64
                minimum: 0
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Content-Range:
              schema:
                type: string
        '503':
          description: Required initial data did not arrive before header wait limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      description: Normal bearer authentication is not used here, but a valid live
        file-specific ticket is mandatory. Validate target suffix, grant and generation.
        Never serve missing bytes, short successful bodies or static incomplete files.
        HEAD never waits for payload. Only a range outside final logical length is
        416; missing payload waits/timeouts according to specification 05.
      parameters:
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: ticket
        in: path
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 200
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      x-authentication: mandatory-scoped-path-ticket
    head:
      operationId: headPlaybackBytes
      tags:
      - Playback
      summary: Validate scoped ticket and describe final logical media length
      responses:
        '200':
          description: Success
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                format: int64
                minimum: 0
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      description: Normal bearer authentication is not used here, but a valid live
        file-specific ticket is mandatory. Validate target suffix, grant and generation.
        Never serve missing bytes, short successful bodies or static incomplete files.
        HEAD never waits for payload. Only a range outside final logical length is
        416; missing payload waits/timeouts according to specification 05. Range is
        ignored on HEAD; return the final logical Content-Length without a body.
      parameters:
      - name: ticket
        in: path
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 200
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      x-authentication: mandatory-scoped-path-ticket
  /api/v1/events:
