                    type: string
                    enum:
                    - ok
                    - unavailable
                required:
                - status
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /api/v1/auth/device-code/inspect:
    post:
      operationId: inspectDeviceCode
      tags:
      - Identity
      summary: Inspect pending device name and expiry before approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeApprove'
      responses:
        '200':
          description: Pending device; no approval or secret is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodePreview'
        default:
          description: Request rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived opaque access token; not JWT and not a playback URL
        token.
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int64
          minimum: 100
          maximum: 599
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        retryAfterSeconds:
          type: integer
          format: int64
          minimum: 0
      required:
      - title
      - status
      - code
    VersionRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - version
      additionalProperties: false
    ServerInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        apiMajor:
          type: integer
          format: int64
        bootstrapRequired:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        minimumClientVersion:
          type: string
          nullable: true
        publicBaseUrl:
          type: string
          format: uri
          nullable: true
          description: Administrator-configured public playback origin. API credentials
            remain scoped to the selected server address.
      required:
      - name
      - version
      - apiMajor
      - bootstrapRequired
      - capabilities
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - administrator
          - member
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        mustChangePassword:
          type: boolean
          description: When true, complete the account password-change flow before
            other actions.
      required:
      - id
      - username
      - displayName
      - role
      - enabled
      - version
    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
        displayName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        role:
          type: string
          enum:
          - administrator
          - member
      required:
      - username
      - displayName
      - password
      - role
      additionalProperties: false
    PatchUser:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
        role:
          type: string
          enum:
          - administrator
          - member
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - version
      additionalProperties: false
    BootstrapRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
        displayName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - code
      - username
      - displayName
      - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        deviceName:
          type: string
          maxLength: 200
      required:
      - username
      - password
      - deviceName
      additionalProperties: false
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      - sessionId
      - user
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - currentPassword
      - newPassword
      additionalProperties: false
    PasswordReset:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - newPassword
      - version
      additionalProperties: false
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
      required:
      - id
      - deviceName
      - createdAt
      - lastSeenAt
      - expiresAt
      - current
    DeviceCodeRequest:
      type: object
      properties:
        deviceName:
          type: string
          maxLength: 200
      required:
      - deviceName
      additionalProperties: false
    DeviceCode:
      type: object
      properties:
        deviceSecret:
          type: string
        userCode:
          type: string
        expiresAt:
          type: string
          format: date-time
        pollIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
      required:
      - deviceSecret
      - userCode
      - expiresAt
      - pollIntervalSeconds
    DeviceCodePoll:
      type: object
      properties:
        deviceSecret:
          type: string
          writeOnly: true
      required:
      - deviceSecret
      additionalProperties: false
    DeviceCodeApprove:
      type: object
      properties:
        userCode:
          type: string
          writeOnly: true
      required:
      - userCode
      additionalProperties: false
    DevicePending:
      type: object
      properties:
        state:
          type: string
          enum:
          - pending
          - expired
          - denied
        retryAfterSeconds:
          type: integer
          format: int64
          minimum: 1
      required:
      - state
    UserPreferences:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        density:
          type: string
          enum:
          - comfortable
          - compact
        libraryLayout:
          type: string
          enum:
          - grid
          - list
        showFilenameExtensions:
          type: boolean
        showContinueWatching:
          type: boolean
        rememberFolderSort:
          type: boolean
        torrentColumns:
          type: array
          items:
            type: string
            enum:
            - title
            - size
            - seeders
            - leechers
            - peers
            - provider
            - publishedAt
        defaultSort:
          type: string
          enum:
          - name
          - date
          - size
        defaultSortOrder:
          type: string
          enum:
          - asc
          - desc
        resumePolicy:
          type: string
          enum:
          - ask
          - always
          - never
        defaultPlaybackSpeed:
          type: number
          format: double
          minimum: 0.25
          maximum: 4
        subtitleScale:
          type: number
          format: double
          minimum: 0.5
          maximum: 3
        preferredAudioLanguage:
          type: string
          maxLength: 50
          nullable: true
          pattern: ^[a-zA-Z0-9_-]{1,50}$
        preferredSubtitleLanguage:
          type: string
          maxLength: 50
          nullable: true
          pattern: ^[a-zA-Z0-9_-]{1,50}$
        slideshowSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
        locale:
          type: string
          maxLength: 30
        accentPreset:
          type: string
          enum:
          - blue
          - teal
          - green
          - purple
          - orange
          - red
        playbackMode:
          type: string
          enum:
          - internal
          - ask
          - external
        pinnedLibraryIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
        keyboardShortcutPreset:
          type: string
          enum:
          - standard
          - minimal
        folderPreferences:
          type: array
          items:
            type: object
            properties:
              libraryId:
                type: string
                format: uuid
              folderId:
                type: string
                format: uuid
                nullable: true
              layout:
                type: string
                enum:
                - grid
                - list
              sort:
                type: string
                enum:
                - name
                - date
                - size
              order:
                type: string
                enum:
                - asc
                - desc
            required:
            - libraryId
            - folderId
            - layout
            - sort
            - order
            additionalProperties: false
          maxItems: 1000
        discoveryViews:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              mode:
                type: string
                enum:
                - latest
                - mostSeeded
                - search
              sort:
                type: string
                enum:
                - publishedAt
                - seeders
                - leechers
                - peers
                - sizeBytes
                - title
              order:
                type: string
                enum:
                - asc
                - desc
              providerIds:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 128
                maxItems: 100
              categories:
                type: array
                items:
                  type: integer
                  format: int64
                  minimum: 0
                maxItems: 100
              minSizeBytes:
                type: integer
                format: int64
                minimum: 0
                nullable: true
              maxSizeBytes:
                type: integer
                format: int64
                minimum: 0
                nullable: true
              minSeeders:
                type: integer
                format: int64
                minimum: 0
                nullable: true
            required:
            - mode
            - sort
            - order
            - providerIds
            - categories
            additionalProperties: false
          description: User-synced per-mode discovery filters and sort; search text
            is not retained.
      required:
      - version
      additionalProperties: false
    LibraryGrant:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        read:
          type: boolean
        download:
          type: boolean
        manage:
          type: boolean
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - userId
      - read
      - download
      - manage
      additionalProperties: false
    Library:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        capabilities:
          type: object
          properties:
            read:
              type: boolean
            download:
              type: boolean
            manage:
              type: boolean
          required:
          - read
          - download
          - manage
        rootPath:
          type: string
          description: Administrator-only; omitted for members.
        scanIntervalSeconds:
          type: integer
          format: int64
          minimum: 60
          nullable: true
      required:
      - id
      - name
      - description
      - readOnly
      - enabled
      - version
      - capabilities
    LibraryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        storageRootId:
          type: string
          format: uuid
        relativePath:
          type: string
          maxLength: 4096
        readOnly:
          type: boolean
      required:
      - name
      - storageRootId
      - relativePath
      - readOnly
      additionalProperties: false
    LibraryPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
        readOnly:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        scanIntervalSeconds:
          type: integer
          format: int64
          minimum: 60
          nullable: true
      required:
      - version
      additionalProperties: false
    GrantUpdate:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        grants:
          type: array
          items:
            $ref: '#/components/schemas/LibraryGrant'
          maxItems: 1000
      required:
      - version
      - grants
      additionalProperties: false
    Entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - folder
          - video
          - photo
          - subtitle
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        mediaId:
          type: string
          format: uuid
          nullable: true
        thumbnailAvailable:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - id
      - libraryId
      - parentId
      - kind
      - name
      - sizeBytes
      - modifiedAt
      - thumbnailAvailable
      - version
    MediaTrack:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - video
          - audio
          - subtitle
        codec:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        default:
          type: boolean
      required:
      - id
      - kind
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        entryId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - video
          - photo
        mimeType:
          type: string
          maxLength: 200
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        width:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        height:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/MediaTrack'
        complete:
          type: boolean
        probeState:
          type: string
          enum:
          - pending
          - ready
          - unsupported
          - failed
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - id
      - libraryId
      - entryId
      - name
      - kind
      - mimeType
      - sizeBytes
      - complete
      - probeState
      - version
    RenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 4096
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - name
      - version
      additionalProperties: false
    MoveRequest:
      type: object
      properties:
        targetFolderId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - targetFolderId
      - version
      additionalProperties: false
    PlaybackProgress:
      type: object
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        watched:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - positionMs
      - durationMs
      - watched
      - updatedAt
      - version
    ProgressUpdate:
      type: object
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        watched:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - positionMs
      - durationMs
      - version
      additionalProperties: false
    ContinueWatching:
      type: object
      properties:
        media:
          $ref: '#/components/schemas/Media'
        progress:
          $ref: '#/components/schemas/PlaybackProgress'
      required:
      - media
      - progress
    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        supportsSearch:
          type: boolean
        supportsRecent:
          type: boolean
        categories:
          type: array
          items:
            type: integer
            format: int64
        state:
          type: string
          enum:
          - healthy
          - degraded
          - unavailable
          - unknown
        warning:
          type: string
          nullable: true
      required:
      - id
      - name
      - enabled
      - supportsSearch
      - supportsRecent
      - categories
      - state
    DiscoveryQuery:
      type: object
      properties:
        mode:
          type: string
          enum:
          - latest
          - mostSeeded
          - search
        query:
          type: string
          maxLength: 200
        providerIds:
          type: array
          items:
            type: string
          maxItems: 100
        categories:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 100
        sort:
          type: string
          enum:
          - publishedAt
          - seeders
          - leechers
          - peers
          - sizeBytes
          - title
        order:
          type: string
          enum:
          - asc
          - desc
        minSizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        maxSizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        minSeeders:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - mode
      additionalProperties: false
      description: Size/seeder filters apply to the bounded fetched result snapshot;
        unknown counts do not satisfy a numeric minimum. Validate min <= max. No exhaustive
        indexer pagination is promised.
    DiscoveryResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        seeders:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        leechers:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        peers:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        providerId:
          type: string
        providerName:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        downloadable:
          type: boolean
        categories:
          type: array
          items:
            type: integer
            format: int64
      required:
      - id
      - title
      - sizeBytes
      - seeders
      - leechers
      - peers
      - providerId
      - providerName
      - publishedAt
      - fetchedAt
      - stale
      - downloadable
    DiscoverySnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - running
          - complete
          - partial
          - failed
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryResult'
        nextCursor:
          type: string
          nullable: true
        totalKnown:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        truncated:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required:
      - id
      - state
      - createdAt
      - expiresAt
      - items
      - nextCursor
      - totalKnown
      - truncated
      - warnings
    TorrentUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - expiresAt
      - sizeBytes
    DownloadSource:
      oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
            - discoveryResult
          value:
            type: string
            format: uuid
        required:
        - kind
        - value
        additionalProperties: false
      - type: object
        properties:
          kind:
            type: string
            enum:
            - magnet
          value:
            type: string
            maxLength: 65536
        required:
        - kind
        - value
        additionalProperties: false
      - type: object
        properties:
          kind:
            type: string
            enum:
            - torrentUpload
          value:
            type: string
            format: uuid
        required:
        - kind
        - value
        additionalProperties: false
      description: Exactly one tagged source. A value is not an arbitrary fetch URL.
    DownloadCreate:
      type: object
      properties:
        libraryId:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/DownloadSource'
      required:
      - libraryId
      - source
      additionalProperties: false
    Download:
      type: object
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - resolving
          - metadataPending
          - awaitingSelection
          - queued
          - downloading
          - paused
          - stalled
          - completeSelected
          - importing
          - seeding
          - completed
          - removing
          - removed
          - failed
        selectedBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        downloadedSelectedBytes:
          type: integer
          format: int64
          minimum: 0
        torrentBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        downloadBps:
          type: integer
          format: int64
          minimum: 0
        uploadBps:
          type: integer
          format: int64
          minimum: 0
        seedersConnected:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        peersConnected:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        etaSeconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        sequential:
          type: boolean
        firstLastMetadataAssist:
          type: boolean
        generation:
          type: string
        version:
