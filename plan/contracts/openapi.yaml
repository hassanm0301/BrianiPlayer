openapi: 3.0.3
info:
  title: Briani Player API
  version: 1.0.0-plan
  description: Implementation contract, not a running service. See specifications
    for authorization, piece-availability, lifecycle and resource limits. Owner-only
    administration is enforced for all admin paths. Playback tickets are mandatory
    capabilities even where normal bearer authentication is not used.
servers:
- url: /
  description: Current Briani Server origin
security:
- AccessToken: []
paths:
  /api/v1/server:
    get:
      operationId: getServer
      tags:
      - Server
      summary: Server capabilities and bootstrap state
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /api/v1/bootstrap:
    post:
      operationId: bootstrapAdmin
      tags:
      - Identity
      summary: Claim one-time administrator bootstrap
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Identity
      summary: Sign in
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags:
      - Identity
      summary: Rotate a refresh token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Identity
      summary: Revoke current session
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/device-code:
    post:
      operationId: createDeviceCode
      tags:
      - Identity
      summary: Create a bounded TV pairing attempt
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
  /api/v1/auth/device-code/token:
    post:
      operationId: exchangeDeviceCode
      tags:
      - Identity
      summary: Poll/exchange the private pairing secret
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '202':
          description: Approval pending; respect polling interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePending'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodePoll'
  /api/v1/auth/device-code/approve:
    post:
      operationId: approveDeviceCode
      tags:
      - Identity
      summary: Approve human code as current user
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeApprove'
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - Identity
      summary: Current identity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/password:
    post:
      operationId: changePassword
      tags:
      - Identity
      summary: Change password and revoke other sessions
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /api/v1/me/sessions:
    get:
      operationId: listOwnSessions
      tags:
      - Identity
      summary: List own sessions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSession'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeOwnSession
      tags:
      - Identity
      summary: Revoke own device session
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      tags:
      - Preferences
      summary: Read effective personal preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updatePreferences
      tags:
      - Preferences
      summary: Update typed personal preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
  /api/v1/me/preferences/reset:
    post:
      operationId: resetPreferences
      tags:
      - Preferences
      summary: Reset personal preferences; preserve device credentials
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
  /api/v1/me/continue-watching:
    get:
      operationId: listContinueWatching
      tags:
      - Media
      summary: List permitted media with playback progress
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinueWatchingPage'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 50
  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags:
      - Administration
      summary: List users as administrator
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createUser
      tags:
      - Administration
      summary: Create a user
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
  /api/v1/admin/users/{id}:
    get:
      operationId: getUser
      tags:
      - Administration
      summary: Read user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateUser
      tags:
      - Administration
      summary: Update user without removing last administrator
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUser'
    delete:
      operationId: deleteUser
      tags:
      - Administration
      summary: Disable/delete according to retained ownership and audit policy
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/admin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags:
      - Administration
      summary: Reset password and revoke sessions
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
  /api/v1/libraries:
    get:
      operationId: listLibraries
      tags:
      - Libraries
      summary: List only permitted libraries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Library'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createLibrary
      tags:
      - Libraries
      summary: Create a library inside mounted storage; administrator only
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryCreate'
  /api/v1/libraries/{id}:
    get:
      operationId: getLibrary
      tags:
      - Libraries
      summary: Get permitted library
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLibrary
      tags:
      - Libraries
      summary: Update library settings; administrator only
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryPatch'
    delete:
      operationId: removeLibrary
      tags:
      - Libraries
      summary: Remove library registration, never implicitly delete its files
      responses:
        '204':
          description: Success
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Reject active downloads/readers unless separately cancelled. Payload
        deletion is not part of this route.
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/libraries/{id}/grants:
    get:
      operationId: getLibraryGrants
      tags:
      - Libraries
      summary: Read grants; administrator only
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    format: int64
                    minimum: 1
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryGrant'
                required:
                - version
                - grants
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setLibraryGrants
      tags:
      - Libraries
      summary: Set grants and revoke affected access
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    format: int64
                    minimum: 1
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryGrant'
                required:
                - version
                - grants
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantUpdate'
  /api/v1/libraries/{id}/entries:
    get:
      operationId: listEntries
      tags:
      - Libraries
      summary: Browse/search permitted entries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 50
      - name: folderId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - folder
          - video
          - photo
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - date
          - size
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/libraries/{id}/scan:
    post:
      operationId: scanLibrary
      tags:
      - Libraries
      summary: Enqueue library scan; administrator or manage grant
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
  /api/v1/media/{id}:
    get:
      operationId: getMedia
      tags:
      - Media
      summary: Read authorized media metadata
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMedia
      tags:
      - Media
      summary: Trash or explicitly remove authorized media
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Protect active readers, seeding payload and shared requests. Permanent
        removal requires explicit confirmed UI action; no cross-library side effects.
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - trash
          - permanent
          default: trash
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/media/{id}/image:
    get:
      operationId: getImage
      tags:
      - Media
      summary: Read a bounded authorized photo representation
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/media/{id}/thumbnail:
    get:
      operationId: getThumbnail
      tags:
      - Media
      summary: Read authorized cached thumbnail
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/media/{id}/rename:
    post:
      operationId: renameMedia
      tags:
      - Media
      summary: Rename a managed library entry safely
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
  /api/v1/media/{id}/move:
    post:
      operationId: moveMedia
      tags:
      - Media
      summary: Move to a folder in the same library
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Request rejected or operation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Use a unique key for retriable mutations; reused key with different
          body is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
  /api/v1/media/{id}/progress:
    get:
      operationId: getPlaybackProgress
      tags:
      - Media
      summary: Read current user progress
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackProgress'
        default:
